name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

jobs:
  # Stage 1: compile and static checks.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/app .

  # Stage 2: unit tests.
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: go test -v ./...

  # Stage 3: package the Containerfile and publish it to ghcr.io.
  # Registry only: no cloud provider steps, so every deploy target reuses this image.
  artifact-registry:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.names.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # ghcr.io needs lowercase names; github.repository may contain uppercase.
      - name: Compute image name
        id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Buildx is required for the type=gha layer cache.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          # amd64 for Cloud Run, Render and CI; arm64 for Apple Silicon and ARM servers.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ github.sha }}
            ${{ steps.names.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.names.outputs.version }}

  # Stage 4b: deploy the same image to Render through its deploy hook.
  # Runs alongside the Cloud Run deploy; see docs/render-setup.md.
  deploy-render:
    needs: artifact-registry
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-render-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Trigger Render deploy of this commit's image
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set; skipping the Render deploy."
            exit 0
          fi
          # Pin the deploy to this commit's tag, not :latest.
          IMAGE="${{ needs.artifact-registry.outputs.image }}:${GITHUB_SHA}"
          curl -fsS -X POST "${HOOK}&imgURL=$(jq -rn --arg v "$IMAGE" '$v|@uri')"
          echo
          echo "Render deploy triggered for ${IMAGE}"
